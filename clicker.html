<!DOCTYPE html>
<html>
<head>
    <title>Super Clicker</title>
</head>
<body style="text-align:center;font-family:Arial;background:#222;color:white;">

    <h1>🎮 Super Clicker</h1>

    <h2>Coins: <span id="coins">0</span></h2>

    <button onclick="clickCoin()" style="font-size:30px;padding:20px;">
        💰 Click For Coins
    </button>

    <br><br>

    <button onclick="buyUpgrade()">
        Buy Upgrade (10 Coins)
    </button>

    <h3>Level: <span id="level">1</span></h3>

    <script>
        let coins = 0;
        let level = 1;

        function clickCoin() {
            coins += level;
            updateScreen();
        }

        function buyUpgrade() {
            if (coins >= 10) {
                coins -= 10;
                level++;
                updateScreen();
            }
        }

        function updateScreen() {
            document.getElementById("coins").innerHTML = coins;
            document.getElementById("level").innerHTML = level;
        }
    </script>

</body>
</html>
